      parameters:
      - description: 用户登出请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 用户登出
      tags:
      - user
  /api/v1/user/me:
    get:

definitions:
  model.AddUserCreditRequest:
    properties:
      credit:
        type: integer
      description:
        type: string
      id:
        type: integer
      operator_id:
        type: integer
      type:
        type: integer
    required:
    - credit
    - id
    - operator_id
    - type
    type: object
  model.AgentChatRequest:
    properties:
      action:
        description: auto | confirm | cancel
        type: string
      image_urls:
        description: 可选 ≤3；相对路径（以 / 开头）由后端拼 agent_public_base_url
        items:
          type: string
        type: array
      session_id:
        description: 空 = 新会话；否则续会话
        type: string
      text:
        type: string
    required:
    - text
    type: object
  model.AgentChatResponse:
    properties:
      created_item_id:
        type: integer
      draft:
        $ref: '#/definitions/model.AgentDraft'
      intent:
        type: string
      matches:
        items:
          $ref: '#/definitions/model.AgentMatchBrief'
        type: array
      questions:
        items:
          type: string
        type: array
      reply:
        type: string
      session_id:
        type: string
      similar:
        items:
          $ref: '#/definitions/model.AgentMatchBrief'
        type: array
      stage:
        type: string
    type: object
  model.AgentDraft:
    properties:
      contact:
        description: 仅当用户明确给出联系方式时才有值（不编造）
        type: string
      description:
        description: ≤200 字
        type: string
      followup_question:
        type: string
      location_detail:
        description: 只写链路表达不了的细节
        type: string
      location_id:
        description: 缺省时由后端填 140「其他地点」
        type: integer
      location_name:
        description: 展示用（地点链路）
        type: string
      lost_found_time:
        description: RFC3339
        type: string
      missing_fields:
        description: location/location_detail/time/contact/color/features/item
        items:
          type: string
        type: array
      tag_ids:
        description: 可直接提交给 /item/create
        items:
          type: integer
        type: array
      tag_names:
        description: 展示用
        items:
          type: string
        type: array
      time_from:
        description: 抽取的时间区间（展示/调试用）
        type: string
      time_to:
        type: string
      title:
        description: ≤100 字节
        type: string
      type:
        description: 0 失物 / 1 招领
        type: integer
    type: object
  model.AgentExtractRequest:
    properties:
      image_urls:
        items:
          type: string
        type: array
      text:
        type: string
    required:
    - text
    type: object
  model.AgentExtractResponse:
    properties:
      draft:

      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UserResponse'
              type: object
      summary: 用户登录
      tags:
      - user
  /api/v1/user/logout:
    post:
      consumes:
      - application/json

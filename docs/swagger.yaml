  /api/v1/agent/chat:
    post:
      consumes:
      - application/json
      description: |-
        普通用户（role=0）的自然语言入口，会话状态存 Redis（TTL 见 openai.agent_session_ttl，滑动续期）。<br />
        首轮：自动判类 + 抽取，分为三种走向：<br />
        1) 建帖（失物/招领）→ 返回 need_confirm 草稿，回复中同时给出缺失项与确认指引（**仅一次**）；<br />
        2) 匹配 → 召回 + LLM 精排，返回 matched（含 score/reasons）或 no_match；<br />
        3) 闲聊/无关 → chitchat 固定话术。<br />
        确认轮（仅 1 轮，严格模式）：回复**补充信息** → 合并后建帖；回复**「确认」** → 直接建帖（缺地点自动填 agent_default_location_id）；含**取消/拒绝**语义 → 放弃；**其他内容与 LLM 故障 → 不建帖**。<br />
        用户明确给出的联系方式会写入 contact（开关 openai.agent_fill_contact，缺省开启，不编造）。<br />
        建帖复用 POST /item/create 的全部校验；响应 created_item_id 为新建物品 ID。<br />
        action=confirm/cancel 可显式确认或放弃；重复确认幂等（返回同一 created_item_id）。<br />
        错误码：120003 输入非法、120004 频率超限、120005 会话状态不允许该操作、120006 功能未开启、120001 会话不存在、120002 智能服务不可用
      parameters:
      - description: 会话请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.AgentChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.AgentChatResponse'
              type: object
      summary: Agent 会话主入口（匹配 / 建帖草稿 / 确认发布）
      tags:
      - agent
  /api/v1/agent/extract:
    post:
      consumes:
      - application/json
      description: |-
        只做「语境判定 + 意图识别 + 信息抽取」，不检索、不建帖。<br />
        draft.tag_ids / location_id / lost_found_time 可直接提交给 POST /item/create；<br />
        不在词表内的标签与地点会被丢弃（置空），模型编造的字段一律不采信。
      parameters:
      - description: 抽取请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.AgentExtractRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.AgentExtractResponse'
              type: object
      summary: Agent 信息抽取（只读，智能填充表单）
      tags:
      - agent
  /api/v1/agent/match:
    post:
      consumes:
      - application/json
      description: |-
        按自然语言描述（可选图片）召回并精排相似帖子：主结果=相反类型（失物↔招领），相似区=同类型最多 2 条。<br />
        返回 entities 为抽取到的结构（前端可用于回显），matches[].item 为完整 ItemResponse（与详情接口口径一致）。<br />
        verdict：strong_match 强匹配 / ambiguous 模糊 / no_match 无匹配（无匹配时仍返回 code=0，matches 为空数组）。
      parameters:
      - description: 匹配请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.AgentMatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.AgentMatchResponse'
              type: object
      summary: Agent 匹配帖子（只读，无会话）
      tags:
      - agent
  /api/v1/agent/session/close:
    post:
      consumes:
      - application/json
      description: 清理当前用户的会话（幂等）；会话不存在时同样返回成功
      parameters:
      - description: 关闭会话请求体（可省略）
        in: body
        name: request
        schema:
          $ref: '#/definitions/model.AgentSessionCloseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 关闭 Agent 会话
      tags:
      - agent

info:
  contact: {}
paths:
  /api/v1/admin/add-credit:
    post:
      consumes:
      - application/json
      description: Role为2的用户改变任意用户积分（含正负），积分会检测不小于0<br />当credit=-99999时，清零积分
      parameters:
      - description: 增加用户积分请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.AddUserCreditRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 系统管理员改变用户积分
      tags:
      - user
  /api/v1/admin/announcement/create:
    post:
      consumes:
      - application/json
      description: 系统管理员创建公告（草稿）
      parameters:
      - description: 创建公告请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UserResponse'
              type: object
      summary: 创建公告
      tags:
      - announcement
  /api/v1/admin/announcement/update:
    post:
      consumes:
      - application/json
      description: 系统管理员保存，发布，删除，下架公告
      parameters:
      - description: 获取公告请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UserResponse'
              type: object
      summary: 获取公告
      tags:
      - announcement
  /api/v1/admin/change-role:
    post:
      consumes:
      - application/json
      description: Role为2的用户改变任意用户Role为0/1/2
      parameters:
      - description: 变更用户角色请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ChangeUserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 系统管理员改变用户角色
      tags:
      - user
  /api/v1/admin/change-status:
    post:
      consumes:
      - application/json
      description: Role为2的用户改变任意用户Status为0(禁用)/1(正常)
      parameters:
      - description: 变更用户角色请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ChangeUserStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 系统管理员改变用户状态(禁用)
      tags:
      - user
  /api/v1/announcement:
    post:
      consumes:
      - application/json
      description: 非系统管理员获取公告
      parameters:
      - description: 获取公告请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UserResponse'
              type: object
      summary: 获取公告
      tags:
      - announcement
  /api/v1/item/{itemID}:
    get:
      consumes:
      - application/json
      description: 返回物品详情（含地点链、标签、图片），浏览量 +1；物品不存在或已删除返回 20001
      parameters:
      - description: 物品ID
        in: path
        name: itemID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.ItemResponse'
              type: object
      summary: 公开获取物品详情
      tags:
      - item
  /api/v1/item/{itemID}/claim:
    post:
      description: 仅 status=0（已发布）物品可认领；不能认领自己发布的物品；<br />server.claim_qq_required
        开启时，未绑定QQ的用户返回 30006；<br />已被他人认领返回 30001，已关闭返回 30005，物品不存在返回 20001
      parameters:
      - description: 物品ID
        in: path
        name: itemID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 登录用户认领物品
      tags:
      - item
  /api/v1/item/{itemID}/claim/cancel:
    post:
      description: 仅物品处于 status=1（已认领）且未关闭时可撤回；<br />认领者和发帖者双方均可撤回，撤回后物品恢复为 status=0
        可再次被认领；<br />已关闭返回 30005，无认领返回 30002，无权撤回返回 30003
      parameters:
      - description: 物品ID
        in: path
        name: itemID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 撤回认领（认领者或发帖者）
      tags:
      - item
  /api/v1/item/{itemID}/close:
    post:
      description: 仅发布者本人可操作；status=0（已发布）或 status=1（已认领）均可关闭；<br />关闭后 status=2 不可再认领/撤回，不发积分（若需确认他人认领并发分请用
        confirm 接口）
      parameters:
      - description: 物品ID
        in: path
        name: itemID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 发帖者关闭自己的帖子
      tags:
      - item
  /api/v1/item/{itemID}/confirm:
    post:
      description: 仅发布者本人可操作，且物品需处于 status=1（已认领）；<br />确认后物品关闭（status=2），并按 server.claim_credit
        给拾到者加积分：<br />拾物帖(type=1)给发帖者，失物帖(type=0)给认领者；<br />无认领可确认返回 30002，已关闭返回 30005，非本人返回
        20005
      parameters:
      - description: 物品ID
        in: path
        name: itemID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 发帖者确认认领并关闭物品
      tags:
      - item
  /api/v1/item/{itemID}/images:
    post:
      consumes:
      - application/json
      description: 仅发布者本人可操作；整体替换该物品的图片列表，最多3张，sort_order 取值1-3且不可重复；<br />传空数组 images=[]
        清空图片；超过3张返回 20013，参数非法返回 20014
      parameters:
      - description: 物品ID
        in: path
        name: itemID
        required: true
        type: integer
      - description: 覆盖式设置图片请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.SetItemImagesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 登录用户覆盖式设置自己物品的图片
      tags:
      - item
  /api/v1/item/{itemID}/locations:
    get:
      consumes:
      - application/json
      description: 返回物品所在地点从根到叶的完整链路（含自身）；物品无地点时返回空数组；物品不存在返回 20001
      parameters:
      - description: 物品ID
        in: path
        name: itemID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Location'
                  type: array
              type: object
      summary: 公开查询物品地点链
      tags:
      - location
  /api/v1/item/create:
    post:
      consumes:
      - application/json
      description: 创建失物（type=0）或招领（type=1）信息，创建即发布（status=0）；<br />user_id 取自 JWT；可携带
        tag_ids 关联标签；location_id 指向不存在地点返回 20010，标签不存在返回 40001
      parameters:
      - description: 创建物品请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 登录用户创建物品信息
      tags:
      - item
  /api/v1/item/delete:
    post:
      consumes:
      - application/json
      description: 仅发布者本人可删；items 表为逻辑删除，删除后 is_deleted=1，不再出现在任何列表/详情中
      parameters:
      - description: 删除物品请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.DeleteItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 登录用户删除自己的物品
      tags:
      - item
  /api/v1/item/list:
    get:
      consumes:
      - application/json
      description: 按类型/状态/地点/标签/关键词筛选物品，分页返回 ItemResponse 数组<br />未指定 status 时默认只返回已发布（status=0）的未删除物品
      parameters:
      - description: '类型: 0丢失 1拾到'
        in: query
        name: type
        type: integer
      - description: '状态: 0已发布 1已认领 2已关闭，默认0'
        in: query
        name: status
        type: integer
      - description: 地点ID
        in: query
        name: location_id
        type: integer
      - description: 标签ID
        in: query
        name: tag_id
        type: integer
      - description: 标题/描述关键词
        in: query
        name: keyword
        type: string
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认10，最大100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.ItemListResponse'
              type: object
      summary: 公开分页查询物品列表
      tags:
      - item
  /api/v1/item/mine:
    get:
      consumes:
      - application/json
      description: 查询当前用户发布的物品，默认返回全部状态；筛选与分页参数同公开列表接口
      parameters:
      - description: '类型: 0丢失 1拾到'
        in: query
        name: type
        type: integer
      - description: '状态: 0已发布 1已认领 2已关闭，默认全部'
        in: query
        name: status
        type: integer
      - description: 标题/描述关键词
        in: query
        name: keyword
        type: string
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认10，最大50
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.ItemListResponse'
              type: object
      summary: 登录用户查询自己的发布记录
      tags:
      - item
  /api/v1/item/update:
    post:
      consumes:
      - application/json
      description: 仅发布者本人可改；给定 id 和非空字段做增量更新，非整体替换；<br />携带 tag_ids（可为空数组）时整体替换标签关联；非本人返回
        20005，物品不存在返回 20001
      parameters:
      - description: 更新物品请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 登录用户增量更新自己的物品
      tags:
      - item
  /api/v1/location/{locationID}:
    delete:
      consumes:
      - application/json
      description: 硬删除（locations 表无 is_deleted）；存在子地点返回 80005，被物品 location_id 引用返回
        80004，地点不存在返回 80001
      parameters:
      - description: 地点ID
        in: path
        name: locationID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 管理员删除地点
      tags:
      - location
  /api/v1/location/create:
    post:
      consumes:
      - application/json
      description: serviceAdmin 及以上角色可创建；根据父元素ID创建地点，parent_id=0 表示根节点（level=1），否则
        level=父级level+1；<br />详细地址 address 可选，sort_order 为递增排序条件（允许0）；父级不存在返回 80001，同父级下重名返回
        80002
      parameters:
      - description: 创建地点请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateLocationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 管理员创建地点
      tags:
      - location
  /api/v1/location/list:
    get:
      consumes:
      - application/json
      description: 按 parent_id / level 筛选地点（均可选，缺省返回全部），按 sort_order 升序；<br />传 parent_id=0
        返回根节点列表，用于级联选择器
      parameters:
      - description: 父地点ID，0表示根节点
        in: query
        name: parent_id
        type: integer
      - description: 树深度
        in: query
        name: level
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Location'
                  type: array
              type: object
      summary: 公开查询地点列表
      tags:
      - location
  /api/v1/location/update:
    post:
      consumes:
      - application/json
      description: 给定 id 和非空字段做增量更新，非整体替换；修改 parent_id 时校验父级存在（80001）、非自身非后代（1），<br
        />并在同一事务中重算整棵子树 level；地点不存在返回 80001，同父级下重名返回 80002
      parameters:
      - description: 更新地点请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateLocationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 管理员更新地点
      tags:
      - location
  /api/v1/superadmin/announcement:
    post:
      consumes:
      - application/json
      description: 系统管理员获取公告
      parameters:
      - description: 获取公告请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UserResponse'
              type: object
      summary: 获取公告
      tags:
      - announcement
  /api/v1/tag/{tagID}:
    delete:
      consumes:
      - application/json
      description: 硬删除（tags 表无 is_deleted）；标签不存在返回 40001，仍被物品关联时返回 40005
      parameters:
      - description: 标签ID
        in: path
        name: tagID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 管理员删除标签
      tags:
      - tag
  /api/v1/tag/create:
    post:
      consumes:
      - application/json
      description: serviceAdmin 及以上角色可创建；标签名必填且唯一（40002），长度 1-50（40004）；<br />color
        可选（十六进制颜色），sort_order 为排序序号（默认0）
      parameters:
      - description: 创建标签请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateTagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 管理员创建标签
      tags:
      - tag
  /api/v1/tag/list:
    get:
      consumes:
      - application/json
      description: 按 sort_order 升序返回全部标签，用于前端筛选器
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Tag'
                  type: array
              type: object
      summary: 公开查询全部标签
      tags:
      - tag
  /api/v1/tag/update:
    post:
      consumes:
      - application/json
      description: 给定 id 和非空字段做增量更新，非整体替换；标签不存在返回 40001，改名与其他标签重复返回 40002
      parameters:
      - description: 更新标签请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateTagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 管理员更新标签
      tags:
      - tag
  /api/v1/upload/image:
    post:
      consumes:
      - multipart/form-data
      description: 头像与物品图通用的图片上传接口，multipart/form-data 的 file 字段；<br />仅支持 jpg/png/webp，单文件最大
        5MB（storage.max_size 可调）；返回相对 URL（如 /uploads/2026/09/26/xxx.jpg），入库与前端展示时需自行拼接服务器源；<br
        />文件过大返回 9，类型不支持返回 10，保存失败返回 11
      parameters:
      - description: 图片文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UploadImageResponse'
              type: object
      summary: 登录用户上传图片
      tags:
      - upload
  /api/v1/user/batch:
    post:
      consumes:
      - application/json
      description: 接收id数组，返回PublicUserResponse数组 <br /> 注意：结果可能不是输入列表的顺序且会过滤无效id
      parameters:
      - description: 获取用户列表请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.BatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 根据id获取用户列表
      tags:
      - user
  /api/v1/user/create:
    post:
      consumes:
      - application/json
      description: 创建新用户。用户名和昵称长度 2-32，密码长度 8-20，用户名必须唯一。<br />不返回用户数据。
      parameters:
      - description: 创建用户请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UserResponse'
              type: object
      summary: 创建用户
      tags:
      - user
  /api/v1/user/login:
    post:
      consumes:
      - application/json
      description: '用户使用用户名和密码登录，验证通过后返回用户信息并在响应体 Header 设置 Authorization : Token'
      parameters:
      - description: 用户登录请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UserResponse'
              type: object
      summary: 用户登录
      tags:
      - user
  /api/v1/user/logout:
    post:
      consumes:
      - application/json
      description: 选择全部登出或仅当前会话登出
      parameters:
      - description: 用户登出请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 用户登出
      tags:
      - user
  /api/v1/user/me:
    get:
      consumes:
      - application/json
      description: 拥有jwt的用户获取自己信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 拥有jwt的用户获取自己信息
      tags:
      - user
  /api/v1/user/qq/bind:
    post:
      consumes:
      - application/json
      description: 用户在统一jti会话中验证验证码，最大次数不超过5次/3分钟 <br />接收json为number，但后端实际操作统一用string
      parameters:
      - description: 绑定QQ请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.QQBindRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 用户通过验证码绑定qq
      tags:
      - user
  /api/v1/user/qq/get-code:
    post:
      consumes:
      - application/json
      description: 后端生成验证码并让陈松发送
      parameters:
      - description: 获取qq验证码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.QQGetCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 用户申请获取qq验证码
      tags:
      - user
  /api/v1/user/update:
    post:
      consumes:
      - application/json
      description: 用户更改昵称、真名、性别、头像
      parameters:
      - description: 用户登出请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 用户更改信息
      tags:
      - user
swagger: "2.0"

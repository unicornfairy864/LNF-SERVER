  /api/v1/item/{item_id}/comments/create:
    post:
      consumes:
      - application/json
      description: 需登录（JWT）；user_id 以登录态为准（请求体 user_id 会被覆盖）；item_id 以请求体为准，路径参数不参与业务校验；<br
        />parent_id 不传时创建根评论（root_id=0），传入时取父评论的 root_id 写入新评论；<br />请求体缺字段或 JSON
        类型错误返回 1，父评论不存在或数据库错误返回 6；成功 data 为 {}
      parameters:
      - description: Bearer JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: 物品ID（路由占位，实际以请求体 item_id 为准）
        in: path
        name: item_id
        required: true
        type: integer
      - description: 创建评论请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 创建评论/回复
      tags:
      - comment
  /api/v1/item/{item_id}/comments/replies:
    get:
      consumes:
      - application/json
      description: 无需登录；以 query id 定位目标评论（限定在路径 item_id 下），返回其所在评论树中不超过 depth 深度、受
        max_count 裁剪的节点（含目标评论本身）；<br />depth 缺省 0：0 仅目标评论，1 再含一级回复，以此类推；max_count
        为返回节点数上限，缺省 0；裁剪深度降到 0 仍超限返回 1；<br />数据库错误返回 6；成功 data 为 {total, comment_dtos}
      parameters:
      - description: 物品ID
        in: path
        name: item_id
        required: true
        type: integer
      - description: 目标评论ID
        in: query
        name: id
        required: true
        type: integer
      - description: 展开深度，缺省0（0=仅目标评论本身）
        in: query
        name: depth
        type: integer
      - description: 返回节点数上限，缺省0
        in: query
        name: max_count
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.CommentsListDTO'
              type: object
      summary: 公开获取评论回复子树
      tags:
      - comment
  /api/v1/item/{item_id}/comments/update:

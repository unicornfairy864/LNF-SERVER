      description: 分页返回当前用户的兑换订单（created_at 降序）；订单为快照设计，商品改名/下架不影响历史记录
      parameters:
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认10，最大100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.OrderListResponse'
              type: object
      summary: 查询我的兑换记录
      tags:
      - shop
  /api/v1/tag/{tagID}:
    delete:
      consumes:
      - application/json
      description: 硬删除（tags 表无 is_deleted）；标签不存在返回 40001，仍被物品关联时返回 40005
      parameters:
      - description: 标签ID
        in: path
        name: tagID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 管理员删除标签
      tags:
      - tag
  /api/v1/tag/create:
    post:
      consumes:
      - application/json
      description: serviceAdmin 及以上角色可创建；标签名必填且唯一（40002），长度 1-50（40004）；<br />color
        可选（十六进制颜色），sort_order 为排序序号（默认0）
      parameters:
      - description: 创建标签请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateTagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 管理员创建标签
      tags:
      - tag
  /api/v1/tag/list:
    get:
      consumes:
      - application/json
      description: 按 sort_order 升序返回全部标签，用于前端筛选器
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Tag'
                  type: array
              type: object
      summary: 公开查询全部标签
      tags:
      - tag
  /api/v1/tag/update:
    post:
      consumes:
      - application/json
      description: 给定 id 和非空字段做增量更新，非整体替换；标签不存在返回 40001，改名与其他标签重复返回 40002
      parameters:
      - description: 更新标签请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateTagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 管理员更新标签
      tags:
      - tag
  /api/v1/upload/image:
    post:
      consumes:
      - multipart/form-data
      description: 头像与物品图通用的图片上传接口，multipart/form-data 的 file 字段；<br />仅支持 jpg/png/webp，单文件最大
        5MB（storage.max_size 可调）；返回相对 URL（如 /uploads/2026/09/26/xxx.jpg），入库与前端展示时需自行拼接服务器源；<br
        />文件过大返回 9，类型不支持返回 10，保存失败返回 11
      parameters:
      - description: 图片文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UploadImageResponse'
              type: object
      summary: 登录用户上传图片
      tags:
      - upload
  /api/v1/user/batch:
    post:
      consumes:
      - application/json

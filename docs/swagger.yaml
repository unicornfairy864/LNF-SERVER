      - location
  /api/v1/location/update:
    post:
      consumes:
      - application/json
      description: 给定 id 和非空字段做增量更新，非整体替换；修改 parent_id 时校验父级存在（80001）、非自身非后代（1），<br
        />并在同一事务中重算整棵子树 level；地点不存在返回 80001，同父级下重名返回 80002
      parameters:
      - description: 更新地点请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateLocationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 管理员更新地点
      tags:
      - location
  /api/v1/notifications:
    delete:
      consumes:
      - application/json
      description: 批量软删除指定通知，跳过自己发给自己的记录，只返回返回码
      parameters:
      - description: 通知ID列表
        in: body
        name: body
        required: true

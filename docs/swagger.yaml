      tags:
      - shop
  /api/v1/shop/goods/{goodsID}/redeem:
    post:
      description: 单事务完成「条件扣库存（stock>0 防超卖）+ 扣积分（行锁，不足回滚）+ 写订单快照」；<br />仅绑定 QQ（5~11
        位）的用户可兑换，未绑定返回 11005；<br />商品不存在/已下架返回 11001，库存不足返回 11002，积分不足返回 50001，用户不存在/禁用返回
        10006；<br />兑换成功后异步发送群消息（失败不影响兑换结果）；返回订单号与兑换后剩余积分
      parameters:
      - description: 商品ID
        in: path
        name: goodsID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.RedeemGoodsResponse'
              type: object
      summary: 积分兑换商品
      tags:
      - shop
  /api/v1/shop/goods/create:
    post:
      consumes:
      - application/json
      description: 创建积分商城商品；name 必填且 ≤100 字符，重名（未下架集合内）返回 11003；<br />price 取值 1~1000000，非法返回
        11004；stock/sort_order 缺省 0
      parameters:
      - description: 创建商品请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateGoodRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 管理员创建商品
      tags:
      - shop
  /api/v1/shop/goods/delete:
    post:
      consumes:
      - application/json
      description: 软删除（is_deleted=1）即下架，商品不再出现在公开列表/详情/兑换中；<br />商品不存在返回 11001；历史订单为快照设计，不受影响
      parameters:
      - description: 下架商品请求体
        in: body
        name: request
        required: true

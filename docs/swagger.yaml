      description: 仅 status=0（已发布）物品可认领；不能认领自己发布的物品；<br />server.claim_qq_required
        开启时，未绑定QQ的用户返回 30006；<br />已被他人认领返回 20003，已关闭返回 20002，不能认领自己的物品返回 30004，账号不存在或被禁用返回
        10006，物品不存在返回 20001
      parameters:
      - description: 物品ID
        in: path
        name: itemID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 登录用户认领物品
      tags:
      - item
  /api/v1/item/{itemID}/claim/cancel:
    post:
      description: 仅物品处于 status=1（已认领）且未关闭时可撤回；<br />认领者和发帖者双方均可撤回，撤回后物品恢复为 status=0
        可再次被认领；<br />已关闭返回 20002，无认领返回 30002，无权撤回返回 30003，物品不存在返回 20001
      parameters:
      - description: 物品ID
        in: path
        name: itemID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 撤回认领（认领者或发帖者）
      tags:
      - item
  /api/v1/item/{itemID}/close:
    post:
      description: 仅发布者本人可操作；status=0（已发布）或 status=1（已认领）均可关闭；<br />关闭后 status=2 不可再认领/撤回，不发积分（若需确认他人认领并发分请用
        confirm 接口）；<br />物品不存在返回 20001，已关闭返回 20002，非本人返回 20005
      parameters:
      - description: 物品ID
        in: path
        name: itemID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 发帖者关闭自己的帖子
      tags:
      - item
  /api/v1/item/{itemID}/confirm:
    post:
      description: 仅发布者本人可操作，且物品需处于 status=1（已认领）；<br />确认后物品关闭（status=2），并按 server.claim_credit
        给拾到者加积分：<br />拾物帖(type=1)给发帖者，失物帖(type=0)给认领者；<br />无认领可确认返回 30002，已关闭返回 20002，非本人返回
        20005，物品不存在返回 20001
      parameters:
      - description: 物品ID
        in: path
        name: itemID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 发帖者确认认领并关闭物品

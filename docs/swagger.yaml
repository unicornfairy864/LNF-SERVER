      summary: 批量删除通知
      tags:
      - Notification
    get:
      consumes:
      - application/json
      description: |-
        获取当前用户的通知列表，支持类型/已读状态/管理员筛选与分页
        分页可能出现重复返回问题，出现问题优先注意这里，解决方法参照公告模块
      parameters:
      - description: 每页数量
        in: query
        name: limit
        type: integer
      - description: 偏移量
        in: query
        name: offset
        type: integer
      - description: '类型: 0系统通知 1物品匹配 2认领申请 3认领结果 4评论回复 5积分变动 6商品兑换'
        in: query
        name: type
        type: integer
      - description: '是否已读: 0未读 1已读'
        in: query
        name: is_read
        type: integer
      - description: 发布管理员ID
        in: query
        name: admin_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.NotificationItem'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 获取通知列表
      tags:
      - Notification
  /api/v1/notifications/{id}:
    get:
      consumes:
      - application/json

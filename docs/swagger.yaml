        type: array
      questions:
        items:
          type: string
        type: array
    type: object
  model.AgentMatchBrief:
    properties:
      item:
        $ref: '#/definitions/model.ItemResponse'
      item_id:
        type: integer
      reasons:
        items:
          type: string
        type: array
      risk:
        items:
          type: string
        type: array
      score:
        type: number
    type: object
  model.AgentMatchRequest:
    properties:

        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 管理员更新评论状态
      tags:
      - comment

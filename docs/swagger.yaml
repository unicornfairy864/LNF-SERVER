  response.CommonResponse:
    properties:
      code:
        $ref: '#/definitions/response.Code'
      data: {}
      message:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/admin/add-credit:
    post:
      consumes:
      - application/json
      description: Role为2的用户改变任意用户积分（含正负），积分会检测不小于0<br />当credit=-99999时，清零积分
      parameters:
      - description: 增加用户积分请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.AddUserCreditRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 系统管理员改变用户积分
      tags:
      - user
  /api/v1/admin/announcement/{id}:
    delete:
      consumes:
      - application/json
      description: 系统管理员软删除公告（is_deleted=1），删除后公开/管理列表与详情均不可见；公告不存在返回 90001，id 非正整数返回
        1
      parameters:
      - description: 公告ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 删除公告
      tags:
      - announcement
  /api/v1/admin/announcement/create:
    post:
      consumes:
      - application/json
      description: 系统管理员创建公告，创建即发布：status=1、published_at=当前时间、admin_id 取自 JWT（不信任请求体）；标题空白或超100字节、内容空白、type
        不在 0-3、is_top 不在 0/1 返回 90003；缺字段/JSON 类型错返回 1；成功 data 为 {}
      parameters:
      - description: 创建公告请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateAnnouncementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 创建公告
      tags:
      - announcement
  /api/v1/admin/announcement/update:
    post:
      consumes:
      - application/json
      description: 系统管理员增量更新：id 必传，其余字段传了才更新（指针语义），view_count/published_at/created_at
        不可更新；status 仅允许 1已发布/2已下架（传 0/3 返回 90003），published_at 保持首次发布时间不变；公告不存在返回
        90001
      parameters:
      - description: 更新公告请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.AnnouncementUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 更新公告
      tags:
      - announcement
  /api/v1/admin/change-role:
    post:
      consumes:
      - application/json
      description: Role为2的用户改变任意用户Role为0/1/2
      parameters:
      - description: 变更用户角色请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ChangeUserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 系统管理员改变用户角色
      tags:
      - user
  /api/v1/admin/change-status:
    post:
      consumes:
      - application/json
      description: Role为2的用户改变任意用户Status为0(禁用)/1(正常)
      parameters:
      - description: 变更用户角色请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ChangeUserStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 系统管理员改变用户状态(禁用)
      tags:
      - user
  /api/v1/admin/notifications:
    post:
      consumes:
      - application/json
      description: 发送通知，支持发给全体用户或指定用户，异步执行，admin_id 从登录态提取
      parameters:
      - description: 发送通知请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.NotificationSendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 发送通知（管理侧）
      tags:
      - Notification
  /api/v1/admin/stats/distribution:
    get:
      description: role>=1；默认30天、最大366天；tag可重复计数，percent分母为发布总数。最多1000标签桶，untagged单列；参数错误code=1，数据库错误code=6。
      parameters:
      - description: Bearer JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: type|tag
        in: query
        name: dimension
        required: true
        type: string
      - description: 开始日期YYYY-MM-DD
        in: query
        name: start_date
        type: string
      - description: 结束日期，与start_date同传
        in: query
        name: end_date
        type: string
      - description: 默认30，1-366，与日期对互斥
        in: query
        name: days
        type: integer
      - description: csv；最多10000行，超时30秒，成功为CSV流
        in: query
        name: export
        type: string
      produces:
      - application/json
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.StatsDistributionResponse'
              type: object
      summary: 管理员维度统计
      tags:
      - admin-stats
  /api/v1/admin/stats/funnel:
    get:
      description: role>=1；各层非嵌套，相邻比率可超过100%，分母0返回0。认领撤回历史无法恢复；归还按updated_at近似。参数错误code=1，数据库错误code=6。
      parameters:
      - description: Bearer JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: 开始日期YYYY-MM-DD
        in: query
        name: start_date
        type: string
      - description: 结束日期，与start_date同传
        in: query
        name: end_date
        type: string
      - description: 默认30，1-366，与日期对互斥
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.StatsFunnelResponse'
              type: object
      summary: 管理员参与漏斗近似统计
      tags:
      - admin-stats
  /api/v1/admin/stats/items/high-view:
    get:
      description: role>=1；未删除且status=0，达到浏览与滞留阈值。排序view_count DESC,created_at ASC,id
        ASC。仅返回批准摘要字段。参数错误code=1，数据库错误code=6。
      parameters:
      - description: Bearer JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: 滞留天数，默认7，1-3650
        in: query
        name: days
        type: integer
      - description: 浏览下限，默认50，1-2147483647
        in: query
        name: min_views
        type: integer
      - description: 页码，默认1，1-10000
        in: query
        name: page
        type: integer
      - description: 每页数量，默认10，1-100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.StatsItemsResponse'
              type: object
      summary: 管理员高浏览低认领清单
      tags:
      - admin-stats
  /api/v1/admin/stats/items/stagnant:
    get:
      description: role>=1；status=0且未删除，created_at<=当前时刻减days天；created_at ASC,id ASC。仅返回物品摘要，无联系方式。参数错误code=1，数据库错误code=6。
      parameters:
      - description: Bearer JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: 滞留天数，默认7，1-3650
        in: query
        name: days
        type: integer
      - description: 页码，默认1，1-10000
        in: query
        name: page
        type: integer
      - description: 每页数量，默认10，1-100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.StatsItemsResponse'
              type: object
      summary: 管理员滞留待处理清单
      tags:
      - admin-stats
  /api/v1/admin/stats/locations:
    get:
      description: role>=1；按直接 location_id 聚合，NULL 单列 unknown，不向父节点归并。percent 分母为期内全部未删除发布量。排序
        count DESC、location_id ASC。参数错误code=1，数据库错误code=6。
      parameters:
      - description: Bearer JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: 开始日期 YYYY-MM-DD，须与 end_date 同传
        in: query

      tags:
      - item
  /api/v1/item/mine:
    get:
      consumes:
      - application/json
      description: 查询当前用户发布的物品，未指定 status 时默认返回已发布与已认领（status=0/1）；筛选与分页参数同公开列表接口
      parameters:
      - description: '类型: 0丢失 1拾到'
        in: query
        name: type
        type: integer
      - description: '状态: 0已发布 1已认领 2已关闭，默认0/1'
        in: query
        name: status
        type: integer
      - description: 标题/描述关键词
        in: query
        name: keyword
        type: string
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认10，最大50
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.ItemListResponse'
              type: object
      summary: 登录用户查询自己的发布记录
      tags:
      - item
  /api/v1/item/search:
    get:
      consumes:
      - application/json
      description: 'match_count = |物品标签 ∩ tag_ids| + (物品地点 ∈ location_ids 中 level=3
        的 ? 1 : 0)，返回 match_count >= min_match 的物品；<br />location_ids 中非 level3 的
        ID 自动忽略且不计入条件总数，tag_ids 去重后不存在的同理；<br />min_match 必传且 ≥1，且 ≤ 条件总数（相等 = 全部条件必须满足）；两组均为空报参数错误；<br
        />status 必传可多选（仅 0已发布/1已认领，传 2 报参数错误）；type 可选；<br />排序 created_at DESC，仅返回
        is_deleted=0 的物品'
      parameters:
      - description: 标签ID列表，逗号分隔或重复参数，如 tag_ids=1,2,3
        in: query
        name: tag_ids
        type: array
      - description: 地点ID列表（仅 level=3 生效），如 location_ids=4,5
        in: query
        name: location_ids
        type: array
      - description: 最少满足条件数（≥1 且 ≤ 条件总数）
        in: query
        name: min_match
        required: true
        type: integer
      - description: '类型: 0丢失 1拾到'
        in: query
        name: type
        type: integer
      - description: '状态多选: 0已发布 1已认领（禁2），如 status=0,1'
        in: query
        name: status
        required: true
        type: array
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认10，最大100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.ItemListResponse'
              type: object
      summary: 多条件最小匹配检索物品（tag+location 计分）
      tags:
      - item
  /api/v1/item/update:
    post:
      consumes:
      - application/json
      description: 仅发布者本人可改；给定 id 和非空字段做增量更新，非整体替换；<br />携带 tag_ids（可为空数组）时整体替换标签关联；非本人返回
        20005，物品不存在返回 20001
      parameters:
      - description: 更新物品请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 登录用户增量更新自己的物品
      tags:
      - item

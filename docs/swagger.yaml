      parameters:
      - description: 物品ID
        in: path
        name: item_id
        required: true
        type: integer
      - description: 分页游标：返回 id <= started_id 的评论，缺省或<=0 表示不限
        in: query
        name: started_id
        type: integer
      - description: 返回条数上限，缺省0
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.CommentsListDTO'
              type: object

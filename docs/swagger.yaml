  /api/v1/item/{item_id}/comments:
    get:
      consumes:
      - application/json
      description: 无需登录；按 id 降序返回该物品的评论（含根评论与回复，不做 root 过滤）；<br />started_id 为游标：返回
        id <= started_id 的评论，缺省或 <=0 表示不限制；limit 为返回条数上限，缺省 0；<br />数据库错误返回 6；成功 data

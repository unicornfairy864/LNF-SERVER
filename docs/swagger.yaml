      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 根据id获取用户列表
      tags:
      - user
  /api/v1/user/create:
    post:
      consumes:
      - application/json
      description: 创建新用户。用户名和昵称长度 2-32，密码长度 8-20，用户名必须唯一。<br />不返回用户数据。
      parameters:
      - description: 创建用户请求体
        in: body
        name: request

      tags:
      - Notification
  /api/v1/shop/goods/{goodsID}:
    get:
      consumes:
      - application/json
      description: 返回未下架商品详情；商品不存在或已下架返回 11001
      parameters:
      - description: 商品ID
        in: path
        name: goodsID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'

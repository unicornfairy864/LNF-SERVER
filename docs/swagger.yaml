            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Location'
                  type: array
              type: object
      summary: 公开查询物品地点链
      tags:
      - location
  /api/v1/item/count:

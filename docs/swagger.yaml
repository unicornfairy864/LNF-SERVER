            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.UserResponse'
              type: object
      summary: 创建用户
      tags:
      - user
  /api/v1/user/login:
    post:
      consumes:
      - application/json

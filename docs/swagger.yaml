      - description: 每页数量，默认10，最大100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.GoodListResponse'
              type: object
      summary: 公开分页查询商品列表
      tags:
      - shop
  /api/v1/shop/goods/update:
    post:
      consumes:
      - application/json
      description: 按 id 增量更新给定字段（指针语义，非整体替换）；软删商品返回 11001；<br />重名返回 11003，price 非法返回
        11004
      parameters:
      - description: 更新商品请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateGoodRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 管理员增量更新商品
      tags:
      - shop
  /api/v1/shop/orders:

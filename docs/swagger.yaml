      - description: 通知ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.CommonResponse'
            - properties:
                data:
                  $ref: '#/definitions/model.Notification'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.CommonResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 获取通知详情
      tags:
      - Notification
  /api/v1/notifications/read:
    put:
      consumes:
      - application/json
      description: 批量将指定通知标记为已读，不限制条数，不返回条数
      parameters:
      - description: 通知ID列表
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.NotificationIDsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.CommonResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.CommonResponse'
      summary: 批量标记通知已读
      tags:
      - Notification
  /api/v1/notifications/unread-count:
    get:
      consumes:
      - application/json
      description: 获取当前用户的未读通知数量，走 Redis 缓存（5 分钟过期）

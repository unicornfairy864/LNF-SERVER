definitions:
  model.AddUserCreditRequest:
    properties:
      credit:
        type: integer
      description:
        type: string
      id:
        type: integer
      operator_id:
        type: integer
      type:
        type: integer
    required:
    - credit
    - id
    - operator_id
    - type
    type: object
  model.BatchRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  model.ChangeUserRoleRequest:
    properties:
      id:
        type: integer
      role:
        type: integer
    required:
    - id
    - role
    type: object
  model.ChangeUserStatusRequest:
    properties:
      id:
        type: integer
      status:
        type: integer
    required:
    - id
    - status
    type: object
  model.CreateItemRequest:
    properties:
      contact:
        type: string
      credit_reward:
        type: integer
      description:
        type: string
      location_detail:
        type: string
      location_id:
        type: integer
      lost_found_time:
        type: string
      tag_ids:
        items:
          type: integer
        type: array
      title:
        type: string
      type:
        type: integer
    required:
    - description
    - lost_found_time
    - title
    - type
    type: object
  model.CreateLocationRequest:
    properties:
      address:
        type: string
      name:
        type: string
      parent_id:
        minimum: 0
        type: integer
      sort_order:
        minimum: 0
        type: integer
    required:
    - name
    type: object
  model.CreateTagRequest:
    properties:
      color:
        type: string
      name:
        type: string
      sort_order:
        type: integer
    required:
    - name
    type: object
  model.CreateUserRequest:
    properties:
      nickname:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - nickname
    - password
    - username
    type: object
  model.DeleteItemRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  model.ItemImage:
    properties:
      created_at:
        type: string
      id:
        type: integer
      image_url:
        type: string
      item_id:
        type: integer
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  model.ItemImageInput:
    properties:
      image_url:
        type: string
      sort_order:
        type: integer
    required:
    - image_url
    - sort_order
    type: object
  model.ItemListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/model.ItemResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  model.ItemResponse:
    properties:
      claim_time:
        type: string
      claim_user_id:
        type: integer
      contact:
        type: string
      created_at:
        type: string
      credit_reward:
        type: integer
      description:
        type: string
      id:
        type: integer
      images:
        items:
          $ref: '#/definitions/model.ItemImage'
        type: array
      location_detail:
        type: string
      locations:
        items:
          $ref: '#/definitions/model.Location'
        type: array
      lost_found_time:
        type: string
      status:
        type: integer
      tags:
        items:
          $ref: '#/definitions/model.Tag'
        type: array
      title:
        type: string
      type:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
      view_count:
        type: integer
    type: object
  model.Location:
    properties:
      address:
        type: string
      created_at:
        type: string
      id:
        type: integer
      level:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  model.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  model.LogoutRequest:
    properties:
      logout_all:
        type: integer
    required:
    - logout_all
    type: object
  model.QQBindRequest:
    properties:
      code:
        type: integer
      qq:
        type: integer
    required:
    - code
    - qq
    type: object
  model.QQGetCodeRequest:
    properties:
      qq:
        type: integer
    required:
    - qq
    type: object
  model.SetItemImagesRequest:
    properties:
      images:
        items:
          $ref: '#/definitions/model.ItemImageInput'
        type: array
    required:
    - images
    type: object
  model.Tag:
    properties:
      color:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  model.UpdateItemRequest:
    properties:
      contact:
        type: string
      credit_reward:
        type: integer
      description:
        type: string
      id:
        type: integer
      location_detail:
        type: string
      location_id:
        type: integer
      lost_found_time:
        type: string
      status:
        type: integer
      tag_ids:
        description: TagIDs 非 nil 时整体替换物品标签关联
        items:
          type: integer
        type: array
      title:
        type: string
    required:
    - id
    type: object
  model.UpdateLocationRequest:
    properties:
      address:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        minimum: 0
        type: integer
      sort_order:
        type: integer
    required:
    - id
    type: object
  model.UpdateTagRequest:
    properties:
      color:
        type: string
      id:
        type: integer
      name:
        type: string
      sort_order:
        type: integer
    required:
    - id
    type: object
  model.UpdateUserRequest:
    properties:
      avatar:
        type: string
      gender:
        type: integer
      nickname:
        type: string
      realname:
        type: string
    type: object
  model.UploadImageResponse:
    properties:
      url:
        description: 图片相对 URL（如 /uploads/2026/09/26/{uuid}.jpg），前端展示时需拼接服务器源
        type: string
    type: object
  model.UserResponse:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      credit:
        type: integer
      gender:
        type: integer
      id:
        type: integer
      last_login_at:
        type: string
      nickname:
        type: string
      qq:
        type: string
      realname:
        type: string
      role:
        type: integer
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
